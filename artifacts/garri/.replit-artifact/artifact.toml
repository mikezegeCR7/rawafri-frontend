kind = "web"
previewPath = "/"
title = "RawAfri Marketplace"
version = "1.0.0"
id = "artifacts/garri"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23424

[services.development]
run = "pnpm --filter @workspace/garri run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/garri", "run", "build" ]
publicDir = "artifacts/garri/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23424"
BASE_PATH = "/"
